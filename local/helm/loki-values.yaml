# grafana/loki 7.0.0 (Loki 3.6.x) — single binary, filesystem storage.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # required for OTLP-native ingestion

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi        # k3s local-path storageclass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Zero out the scalable-mode targets so only the single binary runs.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Laptop: no caches, no canary, no self-test, no gateway.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
