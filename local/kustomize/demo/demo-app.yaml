# Demo workload (local/demo-app/). Image is built locally, tagged with the
# approved internal registry prefix, and imported into k3d — it passes the
# reference image-registry ValidatingAdmissionPolicy as written, and
# imagePullPolicy: Never because that registry doesn't actually exist.
#
# The container deliberately omits `resources`: the reference
# MutatingAdmissionPolicy (security-policy/mutatingadmissionpolicy-
# resource-defaults.yaml) must inject the defaults — which also lets the pod
# pass the tenant ResourceQuota. If the policy didn't work, this pod would be
# rejected; its very scheduling is a live test of ADR-0007.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: team-demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        tenant: team-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: registry.internal.example.com/demo-app:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: "demo-app"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=team-demo"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.platform-observability.svc:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: team-demo
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
# Traefik (k3s built-in) routes demo.localhost -> demo-app. The reference
# architecture uses Gateway API (ADR-0003) with an Envoy Gateway class;
# phase 1 keeps k3s's stock ingress instead of installing a second controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: team-demo
spec:
  ingressClassName: traefik
  rules:
    - host: demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  number: 80
