# LOCAL BUGFIX for the reference MutatingAdmissionPolicy — discovered live on
# k3s v1.36.2, and worth upstreaming into
# security-policy/mutatingadmissionpolicy-resource-defaults.yaml.
#
# The reference expression returns the full container `c` for containers that
# already have requests+limits. An ApplyConfiguration may not include atomic
# fields (e.g. securityContext.capabilities.drop), so for any such container
# the API server rejects the patch and DENIES the pod:
#   policy 'default-resource-requests' ... denied request: error applying
#   patch: invalid ApplyConfiguration: may not mutate atomic arrays, maps or
#   structs: .spec.containers[0].securityContext.capabilities.drop
# This bites (a) the repo's own otel-collector pod (drop: ["ALL"] + resources
# set -> full `c` returned on first invocation) on any pod re-creation after
# the policy is active, and (b) any container without resources that carries
# atomic fields, via IfNeeded reinvocation (second pass sees the injected
# resources and returns full `c`). The repo's kind-based verification used
# containers without atomic fields, which is why it passed.
#
# Fix: never return the full container — for already-satisfied containers
# return only the list-map key ({name: c.name}), a no-op under SSA merge.
- op: replace
  path: /spec/mutations/0/applyConfiguration/expression
  value: >
    Object{
      spec: Object.spec{
        containers: object.spec.containers.map(c,
          (has(c.resources) && has(c.resources.requests) && has(c.resources.limits)) ?
          Object.spec.containers{name: c.name} :
          Object.spec.containers{
            name: c.name,
            resources: Object.spec.containers.resources{
              requests: (has(c.resources) && has(c.resources.requests)) ?
                c.resources.requests : {"cpu": "100m", "memory": "128Mi"},
              limits: (has(c.resources) && has(c.resources.limits)) ?
                c.resources.limits : {"cpu": "500m", "memory": "512Mi"}
            }
          }
        ),
        ?initContainers: !has(object.spec.initContainers) ? optional.none() :
          optional.of(object.spec.initContainers.map(c,
            (has(c.resources) && has(c.resources.requests) && has(c.resources.limits)) ?
            Object.spec.initContainers{name: c.name} :
            Object.spec.initContainers{
              name: c.name,
              resources: Object.spec.initContainers.resources{
                requests: (has(c.resources) && has(c.resources.requests)) ?
                  c.resources.requests : {"cpu": "100m", "memory": "128Mi"},
                limits: (has(c.resources) && has(c.resources.limits)) ?
                  c.resources.limits : {"cpu": "500m", "memory": "512Mi"}
              }
            }
          ))
      }
    }
